apiVersion: v1
kind: Service
metadata:
  name: {{ include "tickets.fullname" . }}
  labels:
    {{- include "tickets.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ports.service }}
      targetPort: {{ .Values.ports.container }}
      protocol: TCP
      name: http
  selector:
    {{- include "tickets.selectorLabels" . | nindent 4 }}